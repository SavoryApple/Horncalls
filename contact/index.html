<body class="page-contact">
  <header>
    <div class="nav-inner">
      <a class="nav-name-group" href="../">
        <span class="crest small" aria-hidden="true">
          <img src="../images/brand-horn-mark.jpg" alt="">
        </span>
        <div class="nav-name">Trevor Nuckols</div>
      </a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="../#biography">Biography</a></li>
          <li><a href="../#watch">Watch &amp; Listen</a></li>
          <li><a href="../#gallery">Gallery</a></li>
          <li><a href="./" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="contact-section" aria-labelledby="contact-heading">
      <div class="wrap contact-wrap">
        <div class="section-head">
          <span class="num">IV.</span>
          <h1 id="contact-heading">Contact</h1>
        </div>
        <p class="contact-lede">Send a message to Trevor here and he will get back with you.</p>

        <form id="contact-form" class="contact-form" novalidate>
          <input type="hidden" name="access_key" value="aa1a6fa9-6e58-4418-8148-56baebb5715f">
          <input type="hidden" name="subject" value="Horncalls website inquiry">
          <input type="hidden" name="from_name" value="Horncalls website">
          <input type="checkbox" name="botcheck" class="contact-honeypot" tabindex="-1" autocomplete="off"
            aria-hidden="true">

          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required maxlength="120">
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="200">
          </div>

          <div class="contact-field">
            <label for="contact-topic">Subject <span class="optional">(optional)</span></label>
            <input id="contact-topic" name="topic" type="text" maxlength="160">
          </div>

          <div class="contact-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="7" required maxlength="4000"></textarea>
          </div>

          <div class="contact-actions">
            <button type="submit" class="contact-submit" id="contact-submit">Send message</button>
            <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <span class="crest large" aria-hidden="true">
      <img src="../images/brand-horn-mark.jpg" alt="">
    </span>
    <span class="nav-name">Trevor Nuckols</span>
    <p>Principal Horn &middot; Evergreen Symphony Orchestra</p>

          rel="noopener noreferrer">SoundCloud</a></li>
      <li><a href="./">Contact</a></li>
    </ul>
    <p class="copy">&copy; <span id="year"></span> Trevor Nuckols</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/contact.js"></script>
